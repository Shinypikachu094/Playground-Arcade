<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crystal Rush</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;touch-action:none;font-family:Inter,system-ui,sans-serif;background:#203044}body{display:grid;place-items:center}.game{width:min(100vw,900px);height:100vh;position:relative;background:#87cbbd}.hud{height:54px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#172033;color:white;font-weight:900;z-index:2}.pill{padding:7px 10px;border-radius:9px;background:#293b4d}.hud button,.card button{border:0;border-radius:9px;padding:8px 14px;background:#ffe066;color:#172033;font:inherit;font-weight:950}.stage{position:absolute;top:54px;bottom:34px;left:0;right:0}.stage canvas{width:100%;height:100%;display:block}.tip{position:absolute;bottom:0;left:0;right:0;height:34px;padding:8px;text-align:center;background:#172033;color:white;font-size:12px;font-weight:800}.modal{position:absolute;inset:0;display:grid;place-items:center;background:#101827aa;z-index:4}.card{width:min(88%,430px);padding:28px;border:4px solid #172033;border-radius:22px;background:#fff5dc;color:#172033;text-align:center;box-shadow:0 10px 0 #172033}.card h1{margin:0 0 8px;font-size:clamp(30px,8vw,54px)}.card p{line-height:1.45;margin:9px 0 20px}.hide{display:none!important}@media(max-width:560px){.hud{font-size:12px;padding:7px}.pill{padding:6px}.hud .pill:nth-child(3){display:none}}
</style></head>
<body><main class="game"><div class="hud"><span class="pill">Score: <b id="score">0</b></span><span class="pill">Crew: <b id="squad">1</b></span><span class="pill">Distance: <b id="road">0m</b></span><button id="pause">Pause</button></div><div class="stage"><canvas id="canvas"></canvas></div><div class="tip">A/D or ◀/▶ to steer · Tap and drag on phones · Shoot the numbered platforms</div><section id="modal" class="modal"><div class="card"><h1 id="title">Crystal Rush</h1><p id="copy">Race through the neon canyon, blast numbered enemy platforms, and grow your crew with every platform you break.</p><button id="start">Start Run</button></div></section></main>
<script>
const CONFIG={
  runnerSpeed:115, // How quickly the road moves toward the player.
  playerSpeed:430, // Side-to-side movement speed.
  bulletSpeed:620, // Speed of each shot.
  fireEvery:230, // Automatic fire interval.
  targetEvery:2600, // Time between small crystal groups.
  targetStart:3, // Starting number on wooden targets.
  targetGrowth:.16, // Target number growth as the run continues.
  targetSpeed:82, // Target movement toward the player.
  maxTargets:5, // Keeps only a few crystals visible at once.
  targetWidth:74, // Barrel width.
  hitPoints:5, // Points for each hit.
  breakPoints:30, // Points for breaking a barrel.
  squadPerBreak:1, // Squad members earned from a broken crystal.
  gateEvery:3000, // Time between multiplier gate choices.
  hordeEvery:12000, // Time between short horde-defense events.
  hordeSize:7, // Number of enemies in each horde event.
  hordeSpeed:125 // Speed of horde enemies.
};
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),squadEl=document.querySelector('#squad'),roadEl=document.querySelector('#road'),pauseBtn=document.querySelector('#pause'),modal=document.querySelector('#modal'),title=document.querySelector('#title'),copy=document.querySelector('#copy'),start=document.querySelector('#start');
let W=900,H=700,dpr=1,last=0,running=false,paused=false,score=0,squad=1,road=0,spawnTimer=0,fireTimer=0,gateTimer=0,hordeTimer=0,keys={},shots=[],targets=[],gates=[],horde=[],sparkles=[],player={x:450,y:0};
function fit(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(2,devicePixelRatio||1);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);player.y=H-80;player.x=Math.max(26,Math.min(W-26,player.x||W/2))}
function reset(){score=0;squad=1;road=0;spawnTimer=200;fireTimer=0;gateTimer=CONFIG.gateEvery;hordeTimer=CONFIG.hordeEvery;shots=[];targets=[];gates=[];horde=[];sparkles=[];paused=false;running=true;pauseBtn.textContent='Pause';modal.classList.add('hide');fit();hud()}
function hud(){scoreEl.textContent=score;squadEl.textContent=squad;roadEl.textContent=Math.floor(road)+'m'}
function laneX(lane){return W*(.18+lane*.16)}
function makeRow(){if(targets.length>=CONFIG.maxTargets)return;const start=Math.floor(Math.random()*4),count=1+Math.floor(Math.random()*2),value=Math.max(2,Math.floor(CONFIG.targetStart+road*CONFIG.targetGrowth/10));for(let i=0;i<count;i++){const lane=(start+i)%5;targets.push({x:laneX(lane),y:-60-i*10,n:value+Math.floor(Math.random()*3),max:value+2,w:CONFIG.targetWidth,h:54,hit:false})}}
function makeGate(){const choices=[{label:'+15',type:'add',value:15},{label:'x1.5',type:'mult',value:1.5},{label:'-5',type:'add',value:-5}];gates.push({x:laneX(Math.floor(Math.random()*5)),y:-80,w:105,h:58,choice:choices[Math.floor(Math.random()*choices.length)],hit:false})}
function startHorde(){for(let i=0;i<CONFIG.hordeSize;i++)horde.push({x:laneX(Math.floor(Math.random()*5)),y:-40-i*35,r:17,hp:2+Math.floor(road/300),hit:false})}
function fire(){const count=Math.min(12,1+Math.floor(Math.log2(Math.max(1,squad))));for(let i=0;i<count;i++){const offset=(i-(count-1)/2)*12;shots.push({x:player.x+offset,y:player.y-35,vy:-CONFIG.bulletSpeed})}if(shots.length>120)shots.splice(0,24)}
function burst(x,y){for(let i=0;i<8;i++)sparkles.push({x,y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,life:500})}
function lose(){running=false;title.textContent='Run Over';copy.textContent=`You reached ${Math.floor(road)}m, scored ${score}, and built a squad of ${squad}.`;start.textContent='Play Again';modal.classList.remove('hide')}
function update(dt){if(!running||paused)return;road+=CONFIG.runnerSpeed*dt;spawnTimer-=dt*1000;fireTimer-=dt*1000;gateTimer-=dt*1000;hordeTimer-=dt*1000;if(spawnTimer<=0){spawnTimer=CONFIG.targetEvery/Math.min(1.8,1+road/700);makeRow()}if(gateTimer<=0){gateTimer=CONFIG.gateEvery;makeGate()}if(hordeTimer<=0){hordeTimer=CONFIG.hordeEvery;startHorde()}if(fireTimer<=0){fireTimer=CONFIG.fireEvery;fire()}const dir=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0);player.x=Math.max(28,Math.min(W-28,player.x+dir*CONFIG.playerSpeed*dt));for(const b of shots)b.y+=b.vy*dt;shots=shots.filter(b=>b.y>-30);for(const t of targets)t.y+=CONFIG.targetSpeed*dt;for(const g of gates)g.y+=CONFIG.targetSpeed*dt;for(const z of horde)z.y+=CONFIG.hordeSpeed*dt;for(const t of targets)if(t.y+t.h/2>player.y-35&&Math.abs(t.x-player.x)<45)lose();for(const b of shots)for(const g of gates)if(!b.hit&&!g.hit&&Math.abs(b.x-g.x)<g.w/2&&Math.abs(b.y-g.y)<g.h/2){b.hit=true;if(g.choice.type==='mult'){g.choice.value*=2;g.choice.label='x'+g.choice.value}else{g.choice.value+=25;g.choice.label=(g.choice.value>=0?'+':'')+g.choice.value}score+=10;burst(g.x,g.y)}for(const g of gates)if(!g.hit&&g.y+g.h/2>player.y-35&&Math.abs(g.x-player.x)<58){g.hit=true;if(g.choice.type==='mult')squad=Math.max(1,Math.floor(squad*g.choice.value));else squad=Math.max(1,squad+g.choice.value);score+=25;burst(g.x,g.y)}for(const z of horde)if(z.y+z.r>player.y-30&&Math.abs(z.x-player.x)<42)lose();for(const b of shots)for(const t of targets)if(!b.hit&&!t.hit&&Math.abs(b.x-t.x)<t.w/2&&Math.abs(b.y-t.y)<t.h/2){b.hit=true;t.n--;score+=CONFIG.hitPoints;burst(b.x,b.y);if(t.n<=0){t.hit=true;score+=CONFIG.breakPoints;squad+=CONFIG.squadPerBreak}}for(const b of shots)for(const z of horde)if(!b.hit&&!z.hit&&Math.abs(b.x-z.x)<z.r+8&&Math.abs(b.y-z.y)<z.r+12){b.hit=true;z.hp-=Math.max(1,squad);score+=8;if(z.hp<=0){z.hit=true;score+=20;squad++}}targets=targets.filter(t=>!t.hit&&t.y<H+80);gates=gates.filter(g=>!g.hit&&g.y<H+90);horde=horde.filter(z=>!z.hit&&z.y<H+50);for(const s of sparkles){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt*1000}sparkles=sparkles.filter(s=>s.life>0);hud()}
function drawRoad(){ctx.fillStyle='#6d9c70';ctx.fillRect(0,0,W,H);ctx.fillStyle='#86b67b';for(let y=-60+(road%120);y<H;y+=120){ctx.fillRect(18,y,72,20);ctx.fillRect(W-90,y+55,72,20)}ctx.fillStyle='#c99e68';ctx.beginPath();ctx.moveTo(W*.12,0);ctx.lineTo(W*.88,0);ctx.lineTo(W*.70,H);ctx.lineTo(W*.30,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#e8c789';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(W*.12,0);ctx.lineTo(W*.30,H);ctx.moveTo(W*.88,0);ctx.lineTo(W*.70,H);ctx.stroke();ctx.strokeStyle='#e0bb7b';ctx.lineWidth=3;for(let y=40+(road%90);y<H;y+=90){ctx.beginPath();ctx.moveTo(W*.5,y);ctx.lineTo(W*.5,y+42);ctx.stroke()}ctx.fillStyle='#4e7e55';for(let y=40+(road%160);y<H;y+=160){ctx.beginPath();ctx.arc(38,y,25,0,Math.PI*2);ctx.arc(W-38,y+60,27,0,Math.PI*2);ctx.fill()}}
function drawBarrel(t){ctx.save();ctx.translate(t.x,t.y);ctx.shadowColor='#ff4fb3';ctx.shadowBlur=12;ctx.fillStyle='#9a4c73';ctx.strokeStyle='#ffd1e8';ctx.lineWidth=3;ctx.fillRect(-t.w/2,-t.h/2,t.w,t.h);ctx.strokeRect(-t.w/2,-t.h/2,t.w,t.h);ctx.shadowBlur=0;ctx.fillStyle='#fff1c7';ctx.font='bold 27px system-ui';ctx.textAlign='center';ctx.fillText(t.n,0,10);ctx.restore();drawHuman(t.x,t.y-43,'#f05b8c','#ffe066',.7,true)}
function drawHuman(x,y,body,accent,scale=1,weapon=true){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#17203366';ctx.beginPath();ctx.ellipse(0,24,15,5,0,0,Math.PI*2);ctx.fill();ctx.lineCap='round';ctx.strokeStyle='#263342';ctx.lineWidth=3;ctx.fillStyle='#f0b58b';ctx.beginPath();ctx.arc(0,-17,8,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#3a2830';ctx.beginPath();ctx.arc(0,-20,8,-Math.PI,0);ctx.fill();ctx.fillStyle='#263342';ctx.fillRect(-4,-16,2,2);ctx.fillRect(2,-16,2,2);ctx.strokeStyle='#9b4f4f';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-2,-10);ctx.lineTo(2,-10);ctx.stroke();ctx.fillStyle=body;ctx.beginPath();ctx.roundRect(-9,-8,18,22,4);ctx.fill();ctx.stroke();ctx.fillStyle='#253246';ctx.beginPath();ctx.moveTo(-7,13);ctx.lineTo(-3,28);ctx.lineTo(-10,28);ctx.closePath();ctx.moveTo(7,13);ctx.lineTo(10,28);ctx.lineTo(3,28);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#f0b58b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-7,-2);ctx.lineTo(-15,10);ctx.moveTo(7,-2);ctx.lineTo(15,7);ctx.stroke();if(weapon){ctx.strokeStyle=accent;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(11,5);ctx.lineTo(29,-9);ctx.stroke();ctx.fillStyle='#172033';ctx.fillRect(20,-12,12,4)}ctx.restore()}
function drawPlayer(){drawHuman(player.x,player.y,'#ff3f9b','#5ef0dc',1.25,true)}
function drawCrew(){const count=Math.min(24,Math.max(0,squad-1));for(let i=0;i<count;i++){const side=i%2===0?-1:1,row=Math.floor(i/2),x=player.x+side*(38+row%3*22),y=player.y+18+Math.floor(row/3)*22;drawHuman(x,y,i%2?'#7df9ff':'#a878ff','#ffe066',.65,true)}}
function drawHorde(z){drawHuman(z.x,z.y,'#a94bca','#ffd1ff',.9,true)}
function draw(){ctx.clearRect(0,0,W,H);drawRoad();for(const g of gates){ctx.save();ctx.translate(g.x,g.y);ctx.strokeStyle=g.choice.type==='mult'?'#ffe066':'#7df9ff';ctx.lineWidth=5;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=18;ctx.strokeRect(-g.w/2,-g.h/2,g.w,g.h);ctx.shadowBlur=0;ctx.fillStyle='#10253ecc';ctx.fillRect(-g.w/2,-g.h/2,g.w,g.h);ctx.fillStyle='#fff6bd';ctx.font='bold 25px system-ui';ctx.textAlign='center';ctx.fillText(g.choice.label,0,9);ctx.restore()}for(const t of targets)drawBarrel(t);for(const z of horde)drawHorde(z);for(const b of shots){ctx.fillStyle='#ffe066';ctx.shadowColor='#fff6bd';ctx.shadowBlur=9;ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}for(const s of sparkles){ctx.fillStyle='#ffe066';ctx.globalAlpha=Math.max(0,s.life/500);ctx.fillRect(s.x,s.y,4,4)}ctx.globalAlpha=1;drawCrew();drawPlayer()}
function loop(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('resize',fit);window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();if(running){paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause'}}});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);pauseBtn.onclick=()=>{if(running){paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause'}};let dragging=false;canvas.addEventListener('pointerdown',e=>{dragging=true;player.x=e.offsetX});canvas.addEventListener('pointermove',e=>{if(dragging)player.x=e.offsetX});window.addEventListener('pointerup',()=>dragging=false);start.onclick=reset;fit();requestAnimationFrame(loop);
</script></body></html>
