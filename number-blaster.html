<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crystal Rush</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;touch-action:none;font-family:Inter,system-ui,sans-serif;background:#203044}body{display:grid;place-items:center}.game{width:min(100vw,900px);height:100vh;position:relative;background:#87cbbd}.hud{height:54px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#172033;color:white;font-weight:900;z-index:2}.pill{padding:7px 10px;border-radius:9px;background:#293b4d}.hud button,.card button{border:0;border-radius:9px;padding:8px 14px;background:#ffe066;color:#172033;font:inherit;font-weight:950}.stage{position:absolute;top:54px;bottom:34px;left:0;right:0}.stage canvas{width:100%;height:100%;display:block}.tip{position:absolute;bottom:0;left:0;right:0;height:34px;padding:8px;text-align:center;background:#172033;color:white;font-size:12px;font-weight:800}.modal{position:absolute;inset:0;display:grid;place-items:center;background:#101827aa;z-index:4}.card{width:min(88%,430px);padding:28px;border:4px solid #172033;border-radius:22px;background:#fff5dc;color:#172033;text-align:center;box-shadow:0 10px 0 #172033}.card h1{margin:0 0 8px;font-size:clamp(30px,8vw,54px)}.card p{line-height:1.45;margin:9px 0 20px}.hide{display:none!important}@media(max-width:560px){.hud{font-size:12px;padding:7px}.pill{padding:6px}.hud .pill:nth-child(3){display:none}}
</style></head>
<body><main class="game"><div class="hud"><span class="pill">Score: <b id="score">0</b></span><span class="pill">Crew: <b id="squad">1</b></span><span class="pill">Distance: <b id="road">0m</b></span><button id="pause">Pause</button></div><div class="stage"><canvas id="canvas"></canvas></div><div class="tip">A/D or ◀/▶ to steer · Tap and drag on phones · Blast the numbered crystals</div><section id="modal" class="modal"><div class="card"><h1 id="title">Crystal Rush</h1><p id="copy">Race through the neon canyon, break numbered crystals, and grow your crew with every crystal you collect.</p><button id="start">Start Run</button></div></section></main>
<script>
const CONFIG={
  runnerSpeed:115, // How quickly the road moves toward the player.
  playerSpeed:430, // Side-to-side movement speed.
  bulletSpeed:620, // Speed of each shot.
  fireEvery:230, // Automatic fire interval.
  targetEvery:700, // Time between target rows.
  targetStart:3, // Starting number on wooden targets.
  targetGrowth:.10, // Target number growth as the run continues.
  targetSpeed:72, // Target movement toward the player.
  maxTargets:24, // Performance limit.
  targetWidth:74, // Barrel width.
  hitPoints:5, // Points for each hit.
  breakPoints:30, // Points for breaking a barrel.
  squadPerBreak:1 // Squad members earned from a broken barrel.
};
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),squadEl=document.querySelector('#squad'),roadEl=document.querySelector('#road'),pauseBtn=document.querySelector('#pause'),modal=document.querySelector('#modal'),title=document.querySelector('#title'),copy=document.querySelector('#copy'),start=document.querySelector('#start');
let W=900,H=700,dpr=1,last=0,running=false,paused=false,score=0,squad=1,road=0,spawnTimer=0,fireTimer=0,keys={},shots=[],targets=[],sparkles=[],player={x:450,y:0};
function fit(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(2,devicePixelRatio||1);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);player.y=H-80;player.x=Math.max(26,Math.min(W-26,player.x||W/2))}
function reset(){score=0;squad=1;road=0;spawnTimer=200;fireTimer=0;shots=[];targets=[];sparkles=[];paused=false;running=true;pauseBtn.textContent='Pause';modal.classList.add('hide');fit();hud()}
function hud(){scoreEl.textContent=score;squadEl.textContent=squad;roadEl.textContent=Math.floor(road)+'m'}
function laneX(lane){return W*(.18+lane*.16)}
function makeRow(){if(targets.length>=CONFIG.maxTargets)return;const start=Math.floor(Math.random()*3),count=2+Math.floor(Math.random()*3),value=Math.max(2,Math.floor(CONFIG.targetStart+road*CONFIG.targetGrowth/10));for(let i=0;i<count;i++){const lane=(start+i)%5;targets.push({x:laneX(lane),y:-60-i*10,n:value+Math.floor(Math.random()*3),max:value+2,w:CONFIG.targetWidth,h:54,hit:false})}}
function fire(){shots.push({x:player.x,y:player.y-35,vy:-CONFIG.bulletSpeed});if(shots.length>90)shots.splice(0,20)}
function burst(x,y){for(let i=0;i<8;i++)sparkles.push({x,y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,life:500})}
function lose(){running=false;title.textContent='Run Over';copy.textContent=`You reached ${Math.floor(road)}m, scored ${score}, and built a squad of ${squad}.`;start.textContent='Play Again';modal.classList.remove('hide')}
function update(dt){if(!running||paused)return;road+=CONFIG.runnerSpeed*dt;spawnTimer-=dt*1000;fireTimer-=dt*1000;if(spawnTimer<=0){spawnTimer=CONFIG.targetEvery/Math.min(1.8,1+road/700);makeRow()}if(fireTimer<=0){fireTimer=CONFIG.fireEvery;fire()}
 const dir=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0);player.x=Math.max(28,Math.min(W-28,player.x+dir*CONFIG.playerSpeed*dt));for(const b of shots)b.y+=b.vy*dt;shots=shots.filter(b=>b.y>-30);for(const t of targets)t.y+=CONFIG.targetSpeed*dt;for(const t of targets){if(t.y+t.h/2>player.y-35&&Math.abs(t.x-player.x)<45)lose()}
 for(const b of shots)for(const t of targets)if(!b.hit&&!t.hit&&Math.abs(b.x-t.x)<t.w/2&&Math.abs(b.y-t.y)<t.h/2){b.hit=true;t.n--;score+=CONFIG.hitPoints;burst(b.x,b.y);if(t.n<=0){t.hit=true;score+=CONFIG.breakPoints;squad+=CONFIG.squadPerBreak}}
 targets=targets.filter(t=>!t.hit&&t.y<H+80);for(const s of sparkles){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt*1000}sparkles=sparkles.filter(s=>s.life>0);hud()}
function drawRoad(){ctx.fillStyle='#182b4b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#263d63';for(let y=-60+(road%120);y<H;y+=120){ctx.fillRect(18,y,72,18);ctx.fillRect(W-90,y+55,72,18)}ctx.fillStyle='#315f70';ctx.beginPath();ctx.moveTo(W*.12,0);ctx.lineTo(W*.88,0);ctx.lineTo(W*.70,H);ctx.lineTo(W*.30,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#54d6c3';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W*.12,0);ctx.lineTo(W*.30,H);ctx.moveTo(W*.88,0);ctx.lineTo(W*.70,H);ctx.stroke();ctx.strokeStyle='#78b8d4';ctx.lineWidth=3;for(let y=40+(road%90);y<H;y+=90){ctx.beginPath();ctx.moveTo(W*.5,y);ctx.lineTo(W*.5,y+42);ctx.stroke()}}
function drawBarrel(t){ctx.save();ctx.translate(t.x,t.y);ctx.shadowColor='#39e6d0';ctx.shadowBlur=14;ctx.fillStyle='#43c7c0';ctx.strokeStyle='#d6fff7';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-t.h/2);ctx.lineTo(t.w/2-8,-t.h/4);ctx.lineTo(t.w/2-8,t.h/4);ctx.lineTo(0,t.h/2);ctx.lineTo(-t.w/2+8,t.h/4);ctx.lineTo(-t.w/2+8,-t.h/4);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#10253e';ctx.font='bold 27px system-ui';ctx.textAlign='center';ctx.fillText(t.n,0,10);ctx.restore()}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#17203399';ctx.beginPath();ctx.ellipse(0,25,30,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff3f9b';ctx.beginPath();ctx.moveTo(-24,15);ctx.lineTo(0,-25);ctx.lineTo(24,15);ctx.closePath();ctx.fill();ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(0,-18,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5ef0dc';ctx.fillRect(-4,-40,8,22);ctx.fillStyle='#9dfbff';ctx.fillRect(-14,16,28,5);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);drawRoad();for(const t of targets)drawBarrel(t);for(const b of shots){ctx.strokeStyle='#fff6bd';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x,b.y+18);ctx.stroke()}for(const s of sparkles){ctx.fillStyle='#ffe066';ctx.globalAlpha=Math.max(0,s.life/500);ctx.fillRect(s.x,s.y,4,4)}ctx.globalAlpha=1;drawPlayer()}
function loop(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('resize',fit);window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();if(running){paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause'}}});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);pauseBtn.onclick=()=>{if(running){paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause'}};let dragging=false;canvas.addEventListener('pointerdown',e=>{dragging=true;player.x=e.offsetX});canvas.addEventListener('pointermove',e=>{if(dragging)player.x=e.offsetX});window.addEventListener('pointerup',()=>dragging=false);start.onclick=reset;fit();requestAnimationFrame(loop);
</script></body></html>
